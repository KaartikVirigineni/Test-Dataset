version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./data:/var/www/html/data
      - ./logs:/var/www/html/logs
    environment:
      - DEBUG=false
      - SECURITY_SALT=featureflags_production_salt_change_this
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s