openapi: 3.0.3
info:
  title: RentaTrack API
  description: A production-ready rentals management system for cars and equipment with JWT authentication
  version: 1.0.0
  contact:
    name: RentaTrack API Support

servers:
  - url: http://localhost:4567
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time

    Equipment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [car, equipment]
        description:
          type: string
        daily_rate:
          type: number
          format: float
        status:
          type: string
          enum: [available, rented, maintenance]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Rental:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        equipment_id:
          type: integer
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        total_cost:
          type: number
          format: float
        status:
          type: string
          enum: [pending, active, completed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

paths:
  /:
    get:
      summary: API Information
      tags:
        - General
      responses:
        '200':
          description: API information and available endpoints
          content:
            application/json:
              schema:
                type: object

  /health:
    get:
      summary: Health Check
      tags:
        - General
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string

  /swagger:
    get:
      summary: OpenAPI Specification
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI YAML specification
          content:
            application/x-yaml:
              schema:
                type: string

  /swagger-ui:
    get:
      summary: Swagger UI
      tags:
        - Documentation
      responses:
        '200':
          description: Interactive API documentation
          content:
            text/html:
              schema:
                type: string

  /api/auth/register:
    post:
      summary: Register new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      summary: User login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      summary: Get current user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/equipment:
    get:
      summary: List all equipment
      tags:
        - Equipment
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [car, equipment]
        - name: status
          in: query
          schema:
            type: string
            enum: [available, rented, maintenance]
      responses:
        '200':
          description: List of equipment
          content:
            application/json:
              schema:
                type: object
                properties:
                  equipment:
                    type: array
                    items:
                      $ref: '#/components/schemas/Equipment'

    post:
      summary: Create new equipment
      tags:
        - Equipment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
                - daily_rate
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [car, equipment]
                description:
                  type: string
                daily_rate:
                  type: number
                  format: float
                status:
                  type: string
                  enum: [available, rented, maintenance]
      responses:
        '201':
          description: Equipment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  equipment:
                    $ref: '#/components/schemas/Equipment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/equipment/{id}:
    get:
      summary: Get equipment by ID
      tags:
        - Equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Equipment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  equipment:
                    $ref: '#/components/schemas/Equipment'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update equipment
      tags:
        - Equipment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [car, equipment]
                description:
                  type: string
                daily_rate:
                  type: number
                  format: float
                status:
                  type: string
                  enum: [available, rented, maintenance]
      responses:
        '200':
          description: Equipment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  equipment:
                    $ref: '#/components/schemas/Equipment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete equipment
      tags:
        - Equipment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Equipment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Cannot delete equipment with active rentals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rentals:
    get:
      summary: List rentals
      description: Returns all rentals for admin users, or only user's own rentals for regular users
      tags:
        - Rentals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of rentals
          content:
            application/json:
              schema:
                type: object
                properties:
                  rentals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rental'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new rental
      tags:
        - Rentals
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - equipment_id
                - start_date
                - end_date
              properties:
                equipment_id:
                  type: integer
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
      responses:
        '201':
          description: Rental created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rental:
                    $ref: '#/components/schemas/Rental'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Equipment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error or equipment not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rentals/{id}:
    get:
      summary: Get rental by ID
      tags:
        - Rentals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rental details
          content:
            application/json:
              schema:
                type: object
                properties:
                  rental:
                    $ref: '#/components/schemas/Rental'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Not your rental
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rental not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete rental
      description: Admin only
      tags:
        - Rentals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rental deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rental not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rentals/{id}/status:
    put:
      summary: Update rental status
      tags:
        - Rentals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, active, completed, cancelled]
      responses:
        '200':
          description: Rental status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rental:
                    $ref: '#/components/schemas/Rental'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Not your rental
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Rental not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'