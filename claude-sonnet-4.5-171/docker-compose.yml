version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/data/logview.db
      - Jwt__Key=SuperSecretKeyForJWTTokenGeneration12345
      - Jwt__Issuer=LogViewLite
      - Jwt__Audience=LogViewLite
      - Jwt__ExpiryMinutes=60
    volumes:
      - logview-data:/data
    restart: unless-stopped

volumes:
  logview-data: