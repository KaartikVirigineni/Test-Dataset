openapi: 3.0.3
info:
  title: LogView Lite API
  description: REST API for log management and viewing with authentication and RBAC
  version: 1.0.0
  contact:
    name: LogView Lite
servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: admin123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token for authentication
        username:
          type: string
        role:
          type: string
          enum: [Admin, Viewer]

    CreateLogRequest:
      type: object
      required:
        - message
      properties:
        level:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR, FATAL]
          default: INFO
        source:
          type: string
          description: Source application or service name
          example: api-service
        message:
          type: string
          description: Log message content
        metadata:
          type: string
          description: Additional metadata in JSON format
          nullable: true

    LogEntry:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        source:
          type: string
        message:
          type: string
        metadata:
          type: string
          nullable: true

    LogQueryRequest:
      type: object
      properties:
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        level:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        searchText:
          type: string
          nullable: true
        page:
          type: integer
          default: 1
          minimum: 1
        pageSize:
          type: integer
          default: 50
          minimum: 1
          maximum: 1000

    LogQueryResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    Statistics:
      type: object
      additionalProperties:
        type: integer
      example:
        INFO: 150
        ERROR: 25
        WARN: 40

    Error:
      type: object
      properties:
        message:
          type: string

paths:
  /api/auth/login:
    post:
      summary: Authenticate user
      description: Login with username and password to receive a JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/logs:
    post:
      summary: Create log entry
      description: Create a new log entry (Admin only)
      tags:
        - Logs
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLogRequest'
      responses:
        '201':
          description: Log created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin role required

  /api/logs/query:
    post:
      summary: Query logs
      description: Search and filter logs with pagination
      tags:
        - Logs
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogQueryResponse'
        '401':
          description: Unauthorized

  /api/logs/{id}:
    get:
      summary: Get log by ID
      description: Retrieve a specific log entry
      tags:
        - Logs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '404':
          description: Log not found
        '401':
          description: Unauthorized

    delete:
      summary: Delete log entry
      description: Delete a log entry (Admin only)
      tags:
        - Logs
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Log deleted successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin role required

  /api/logs/statistics:
    get:
      summary: Get log statistics
      description: Get count of logs grouped by level
      tags:
        - Logs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistics by log level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
        '401':
          description: Unauthorized

  /swagger:
    get:
      summary: Get OpenAPI specification
      description: Returns the OpenAPI YAML specification
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Logs
    description: Log management and querying
  - name: Documentation
    description: API documentation