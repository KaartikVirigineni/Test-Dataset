version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./data:/var/www/html/data
    environment:
      - PHP_DISPLAY_ERRORS=Off
      - PHP_ERROR_REPORTING=E_ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/swagger"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s