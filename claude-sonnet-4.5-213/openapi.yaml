openapi: 3.0.3
info:
  title: Consent & Cookie Management Platform (CMP) API
  description: Production-ready REST API for managing user consent and cookie preferences with GDPR compliance
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time

    Cookie:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [Essential, Analytics, Marketing, Functional]
        description:
          type: string
        duration:
          type: integer
          description: Cookie duration in seconds
        vendor:
          type: string
        is_essential:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Consent:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        cookie_id:
          type: integer
        cookie_name:
          type: string
        category:
          type: string
        granted:
          type: boolean
        consent_date:
          type: string
          format: date-time
        ip_address:
          type: string
        user_agent:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /health:
    get:
      summary: Health check endpoint
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string

  /swagger:
    get:
      summary: Get OpenAPI specification
      tags:
        - System
      responses:
        '200':
          description: OpenAPI YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                role:
                  type: string
                  enum: [user, admin]
                  default: user
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me:
    get:
      summary: Get current user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me/consents:
    get:
      summary: Get current user's consents
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user consents
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consent'

  /api/users/me/logs:
    get:
      summary: Get current user's consent activity logs
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of consent logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        action:
                          type: string
                        details:
                          type: string
                        timestamp:
                          type: string

  /api/cookies:
    get:
      summary: List all cookies
      tags:
        - Cookies
      responses:
        '200':
          description: List of cookies
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cookie'

    post:
      summary: Create a new cookie (Admin only)
      tags:
        - Cookies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
              properties:
                name:
                  type: string
                category:
                  type: string
                  enum: [Essential, Analytics, Marketing, Functional]
                description:
                  type: string
                duration:
                  type: integer
                vendor:
                  type: string
                is_essential:
                  type: boolean
      responses:
        '201':
          description: Cookie created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  cookie:
                    $ref: '#/components/schemas/Cookie'
        '401':
          description: Unauthorized
        '403':
          description: Admin access required

  /api/cookies/{id}:
    get:
      summary: Get cookie by ID
      tags:
        - Cookies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cookie details
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookie:
                    $ref: '#/components/schemas/Cookie'
        '404':
          description: Cookie not found

    put:
      summary: Update cookie (Admin only)
      tags:
        - Cookies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
              properties:
                name:
                  type: string
                category:
                  type: string
                  enum: [Essential, Analytics, Marketing, Functional]
                description:
                  type: string
                duration:
                  type: integer
                vendor:
                  type: string
                is_essential:
                  type: boolean
      responses:
        '200':
          description: Cookie updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  cookie:
                    $ref: '#/components/schemas/Cookie'
        '404':
          description: Cookie not found
        '403':
          description: Admin access required

    delete:
      summary: Delete cookie (Admin only)
      tags:
        - Cookies
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cookie deleted
        '404':
          description: Cookie not found
        '403':
          description: Admin access required

  /api/consents:
    get:
      summary: Get user's consents
      tags:
        - Consents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of consents
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Consent'

    post:
      summary: Record a consent
      tags:
        - Consents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cookie_id
                - granted
              properties:
                cookie_id:
                  type: integer
                granted:
                  type: boolean
      responses:
        '200':
          description: Consent recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  consent:
                    $ref: '#/components/schemas/Consent'
        '404':
          description: Cookie not found

  /api/consents/batch:
    post:
      summary: Record multiple consents at once
      tags:
        - Consents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consents
              properties:
                consents:
                  type: array
                  items:
                    type: object
                    required:
                      - cookie_id
                      - granted
                    properties:
                      cookie_id:
                        type: integer
                      granted:
                        type: boolean
      responses:
        '200':
          description: Batch consents recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer

  /api/consents/{cookie_id}:
    delete:
      summary: Delete a consent
      tags:
        - Consents
      security:
        - bearerAuth: []
      parameters:
        - name: cookie_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Consent deleted
        '404':
          description: Consent not found

tags:
  - name: System
    description: System health and documentation
  - name: Authentication
    description: User authentication endpoints
  - name: Users
    description: User profile and data
  - name: Cookies
    description: Cookie management
  - name: Consents
    description: Consent management