version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/app/runtime
      - ./db:/app/db
    environment:
      - YII_ENV=prod
      - YII_DEBUG=0
    command: php -S 0.0.0.0:8000 -t web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3