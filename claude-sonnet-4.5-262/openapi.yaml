openapi: 3.0.3
info:
  title: API Gateway Admin
  description: Production-ready API gateway and administration platform with RBAC
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: auth
    description: Authentication endpoints
  - name: users
    description: User management
  - name: api-keys
    description: API key management
  - name: routes
    description: Gateway route management
  - name: roles
    description: RBAC role and permission management
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: integer
  /auth/login:
    post:
      tags:
        - auth
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
  /auth/register:
    post:
      tags:
        - auth
      summary: User registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
  /users:
    get:
      tags:
        - users
      summary: List all users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      tags:
        - users
      summary: Get user by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags:
        - users
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                status:
                  type: integer
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags:
        - users
      summary: Delete user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted
  /api-keys:
    get:
      tags:
        - api-keys
      summary: List API keys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    post:
      tags:
        - api-keys
      summary: Create API key
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - user_id
              properties:
                name:
                  type: string
                user_id:
                  type: integer
                expires_at:
                  type: integer
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
  /api-keys/{id}:
    get:
      tags:
        - api-keys
      summary: Get API key by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    put:
      tags:
        - api-keys
      summary: Update API key
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: integer
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    delete:
      tags:
        - api-keys
      summary: Delete API key
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: API key deleted
  /routes:
    get:
      tags:
        - routes
      summary: List all routes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
    post:
      tags:
        - routes
      summary: Create route
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
                - method
                - upstream_url
              properties:
                path:
                  type: string
                method:
                  type: string
                  enum: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
                upstream_url:
                  type: string
                rate_limit:
                  type: integer
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
  /routes/{id}:
    get:
      tags:
        - routes
      summary: Get route by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Route details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
    put:
      tags:
        - routes
      summary: Update route
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                upstream_url:
                  type: string
                status:
                  type: integer
                rate_limit:
                  type: integer
      responses:
        '200':
          description: Route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
    delete:
      tags:
        - routes
      summary: Delete route
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Route deleted
  /roles:
    get:
      tags:
        - roles
      summary: List all roles and permissions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of roles and permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                      permissions:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
    post:
      tags:
        - roles
      summary: Create role or permission
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [role, permission]
                  default: role
      responses:
        '200':
          description: Role or permission created
  /roles/{name}:
    delete:
      tags:
        - roles
      summary: Delete role or permission
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role or permission deleted
  /roles/assign:
    post:
      tags:
        - roles
      summary: Assign role to user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - user_id
              properties:
                role:
                  type: string
                user_id:
                  type: integer
      responses:
        '200':
          description: Role assigned
  /roles/revoke:
    post:
      tags:
        - roles
      summary: Revoke role from user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
                - user_id
              properties:
                role:
                  type: string
                user_id:
                  type: integer
      responses:
        '200':
          description: Role revoked
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        status:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer
    ApiKey:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        key:
          type: string
        status:
          type: integer
        created_at:
          type: integer
        expires_at:
          type: integer
    Route:
      type: object
      properties:
        id:
          type: integer
        path:
          type: string
        method:
          type: string
        upstream_url:
          type: string
        status:
          type: integer
        rate_limit:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer