version: '3.8'

services:
  app:
    build: .
    container_name: ticketdesk
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///app/data/tickets.db
      - JWT_SECRET=change_this_secret_in_production_please_use_random_string
      - RUST_LOG=info
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data: