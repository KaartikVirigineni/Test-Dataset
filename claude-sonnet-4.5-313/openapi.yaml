openapi: 3.0.1
info:
  title: ExpenseTracker API
  version: v1
  description: REST API for expense tracking with JWT authentication
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  username:
                    type: string
        '400':
          description: Bad request
        '409':
          description: Username already exists
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
        '401':
          description: Invalid credentials
  /api/expenses:
    get:
      tags:
        - Expenses
      summary: Get all expenses for authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Unauthorized
    post:
      tags:
        - Expenses
      summary: Create a new expense
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Unauthorized
  /api/expenses/{id}:
    get:
      tags:
        - Expenses
      summary: Get expense by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Expense details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
    put:
      tags:
        - Expenses
      summary: Update an expense
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
      responses:
        '200':
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
    delete:
      tags:
        - Expenses
      summary: Delete an expense
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Expense deleted
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
    CreateExpenseRequest:
      type: object
      required:
        - description
        - amount
        - date
        - category
      properties:
        description:
          type: string
          maxLength: 500
        amount:
          type: number
          format: decimal
        date:
          type: string
          format: date-time
        category:
          type: string
    UpdateExpenseRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 500
        amount:
          type: number
          format: decimal
        date:
          type: string
          format: date-time
        category:
          type: string
    ExpenseResponse:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        amount:
          type: number
          format: decimal
        date:
          type: string
          format: date-time
        category:
          type: string
        createdAt:
          type: string
          format: date-time