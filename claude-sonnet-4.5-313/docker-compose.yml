version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/expenses.db
      - Jwt__Key=SuperSecretKeyForJWTTokenGeneration123456
      - Jwt__Issuer=ExpenseTracker
      - Jwt__Audience=ExpenseTrackerUsers
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data: