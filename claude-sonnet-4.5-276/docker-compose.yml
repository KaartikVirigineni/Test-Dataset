version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/imagegallery.db
      - Jwt__Key=ThisIsASecretKeyForJWTTokenGenerationMinimum32CharactersLongForProduction
      - Jwt__Issuer=ImageGallery
      - Jwt__Audience=ImageGalleryUsers
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
    restart: unless-stopped

volumes:
  app-data:
  app-uploads: