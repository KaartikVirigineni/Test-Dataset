openapi: 3.0.3
info:
  title: ImageGallery API
  description: REST API for Image Gallery application with JWT authentication
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: testuser
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Username already exists or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: testuser
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/images:
    get:
      tags:
        - Images
      summary: Get all images
      description: Public endpoint that returns all uploaded images
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageDto'
  /api/images/my:
    get:
      tags:
        - Images
      summary: Get current user's images
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user's images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageDto'
        '401':
          description: Unauthorized
  /api/images/{id}:
    get:
      tags:
        - Images
      summary: Get image details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        '404':
          description: Image not found
    delete:
      tags:
        - Images
      summary: Delete an image
      description: Only the owner can delete their image
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Image deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Image not found or no permission
  /api/images/{id}/file:
    get:
      tags:
        - Images
      summary: Download image file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
  /api/images/upload:
    post:
      tags:
        - Images
      summary: Upload a new image
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - file
              properties:
                title:
                  type: string
                  example: Beautiful Sunset
                description:
                  type: string
                  example: A stunning sunset over the mountains
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDto'
        '400':
          description: Invalid input or unsupported file type
        '401':
          description: Unauthorized
  /swagger:
    get:
      tags:
        - Documentation
      summary: Get OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML specification
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
        username:
          type: string
        userId:
          type: integer
    ImageDto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        userId:
          type: integer
        username:
          type: string