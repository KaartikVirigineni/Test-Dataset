version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/loglite.db
      - JWT_SECRET=dev-secret-key-change-in-production
      - RUST_LOG=info
    volumes:
      - sqlite_data:/data
    command: /app/loglite

volumes:
  sqlite_data: