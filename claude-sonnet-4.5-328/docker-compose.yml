version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://db:27017/meteor
      - JWT_SECRET=uptime-monitor-secret-key-change-in-production
    volumes:
      - ./.meteor/local:/app/.meteor/local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data: