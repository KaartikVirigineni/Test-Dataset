version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8000
      - ConnectionStrings__DefaultConnection=Data Source=/data/devportal.db
      - Jwt__Key=DevPortalSecretKey123456789012345678901234567890
      - Jwt__ExpiryInHours=24
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data: