version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/freelancehub.db
      - Jwt__Key=SuperSecretKeyForProductionUseOnly12345678
    volumes:
      - sqlite-data:/data
    command: ["dotnet", "FreelanceHub.dll"]

volumes:
  sqlite-data: