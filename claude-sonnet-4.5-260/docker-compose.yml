version: '3.8'

services:
  app:
    build: .
    container_name: docuvault
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///app/data/docuvault.db
      - JWT_SECRET=change-this-secret-in-production-please-use-a-long-random-string
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped