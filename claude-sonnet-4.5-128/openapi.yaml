openapi: 3.0.3
info:
  title: Gist Manager API
  description: A production-ready REST API for managing code gists with authentication and RBAC
  version: 1.0.0
servers:
  - url: http://localhost:6543
    description: Development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
    
    Gist:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        content:
          type: string
        language:
          type: string
        is_public:
          type: boolean
        owner_id:
          type: integer
        owner_username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    UserRegistration:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    
    UserLogin:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    
    GistCreate:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        content:
          type: string
        language:
          type: string
          default: text
        is_public:
          type: boolean
          default: true
    
    GistUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        content:
          type: string
        language:
          type: string
        is_public:
          type: boolean
    
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/gists:
    get:
      summary: List all gists
      tags:
        - Gists
      description: Returns public gists for unauthenticated users, public gists and own gists for authenticated users
      responses:
        '200':
          description: List of gists
          content:
            application/json:
              schema:
                type: object
                properties:
                  gists:
                    type: array
                    items:
                      $ref: '#/components/schemas/Gist'
    
    post:
      summary: Create a new gist
      tags:
        - Gists
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GistCreate'
      responses:
        '201':
          description: Gist created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  gist:
                    $ref: '#/components/schemas/Gist'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/gists/{id}:
    get:
      summary: Get a specific gist
      tags:
        - Gists
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gist details
          content:
            application/json:
              schema:
                type: object
                properties:
                  gist:
                    $ref: '#/components/schemas/Gist'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Update a gist
      tags:
        - Gists
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GistUpdate'
      responses:
        '200':
          description: Gist updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  gist:
                    $ref: '#/components/schemas/Gist'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Delete a gist
      tags:
        - Gists
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gist deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /swagger:
    get:
      summary: Get OpenAPI specification
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI spec in YAML format
          content:
            application/yaml:
              schema:
                type: string
  
  /docs:
    get:
      summary: Swagger UI documentation
      tags:
        - Documentation
      responses:
        '200':
          description: Interactive API documentation
          content:
            text/html:
              schema:
                type: string