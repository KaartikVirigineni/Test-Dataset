version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./writable:/var/www/html/writable
      - ./database:/var/www/html/database
    environment:
      - CI_ENVIRONMENT=production
      - DATABASE_PATH=/var/www/html/writable/database.db
    command: php spark serve --host=0.0.0.0 --port=8000