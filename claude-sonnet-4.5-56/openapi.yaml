openapi: 3.0.3
info:
  title: Analytics Dashboard API
  description: Production-ready analytics dashboard with JWT authentication
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string

    Analytic:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        metric_name:
          type: string
        value:
          type: number
          format: float
        metadata:
          type: object
        timestamp:
          type: string
          format: date-time

    AuthPayload:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    StatsMetric:
      type: object
      properties:
        metric_name:
          type: string
        count:
          type: integer
        avg_value:
          type: number
        total_value:
          type: number

    DashboardStats:
      type: object
      properties:
        total_records:
          type: integer
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/StatsMetric'

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/analytics:
    get:
      summary: Get all analytics for current user
      tags:
        - Analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Analytic'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new analytic record
      tags:
        - Analytics
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metric_name
                - value
              properties:
                metric_name:
                  type: string
                value:
                  type: number
                metadata:
                  type: object
      responses:
        '201':
          description: Analytic created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytic'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/analytics/{id}:
    get:
      summary: Get specific analytic record
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Analytic record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytic'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update analytic record
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric_name:
                  type: string
                value:
                  type: number
                metadata:
                  type: object
      responses:
        '200':
          description: Analytic updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytic'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete analytic record
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/dashboard/stats:
    get:
      summary: Get dashboard statistics
      tags:
        - Analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /graphql:
    post:
      summary: GraphQL endpoint
      tags:
        - GraphQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object

  /swagger:
    get:
      summary: Get OpenAPI specification
      tags:
        - Documentation
      responses:
        '200':
          description: OpenAPI YAML spec
          content:
            application/yaml:
              schema:
                type: string