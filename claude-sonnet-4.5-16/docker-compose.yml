version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/warehouse.db
    volumes:
      - warehouse-data:/data
    restart: unless-stopped

volumes:
  warehouse-data: