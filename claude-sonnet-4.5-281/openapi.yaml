openapi: 3.0.3
info:
  title: PodcastHub API
  description: REST API for podcast hosting platform with user authentication
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
    
    Podcast:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        image_url:
          type: string
        created_at:
          type: string
          format: date-time
        author_name:
          type: string
    
    Episode:
      type: object
      properties:
        id:
          type: integer
        podcast_id:
          type: integer
        title:
          type: string
        description:
          type: string
        audio_url:
          type: string
        duration:
          type: integer
        published_at:
          type: string
          format: date-time
        podcast_title:
          type: string
    
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: string

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /podcasts:
    get:
      summary: Get all podcasts
      tags:
        - Podcasts
      responses:
        '200':
          description: List of podcasts
          content:
            application/json:
              schema:
                type: object
                properties:
                  podcasts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Podcast'
    
    post:
      summary: Create a new podcast
      tags:
        - Podcasts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                image_url:
                  type: string
      responses:
        '201':
          description: Podcast created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  podcast:
                    $ref: '#/components/schemas/Podcast'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /podcasts/{id}:
    get:
      summary: Get podcast by ID
      tags:
        - Podcasts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Podcast details with episodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  podcast:
                    $ref: '#/components/schemas/Podcast'
                  episodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Episode'
        '404':
          description: Podcast not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Update podcast
      tags:
        - Podcasts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                image_url:
                  type: string
      responses:
        '200':
          description: Podcast updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  podcast:
                    $ref: '#/components/schemas/Podcast'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Podcast not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Delete podcast
      tags:
        - Podcasts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Podcast deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Podcast not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /episodes:
    get:
      summary: Get all episodes
      tags:
        - Episodes
      parameters:
        - name: podcast_id
          in: query
          required: false
          schema:
            type: integer
          description: Filter episodes by podcast ID
      responses:
        '200':
          description: List of episodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  episodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Episode'
    
    post:
      summary: Create a new episode
      tags:
        - Episodes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - podcast_id
                - title
                - audio_url
              properties:
                podcast_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                audio_url:
                  type: string
                duration:
                  type: integer
      responses:
        '201':
          description: Episode created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  episode:
                    $ref: '#/components/schemas/Episode'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Podcast not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /episodes/{id}:
    get:
      summary: Get episode by ID
      tags:
        - Episodes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Episode details
          content:
            application/json:
              schema:
                type: object
                properties:
                  episode:
                    $ref: '#/components/schemas/Episode'
        '404':
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Update episode
      tags:
        - Episodes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                audio_url:
                  type: string
                duration:
                  type: integer
      responses:
        '200':
          description: Episode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  episode:
                    $ref: '#/components/schemas/Episode'
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      summary: Delete episode
      tags:
        - Episodes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Episode deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Episode not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'