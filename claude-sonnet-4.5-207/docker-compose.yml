version: '3.8'

services:
  app:
    build: .
    ports:
      - "4567:4567"
    environment:
      - RACK_ENV=production
      - PORT=4567
      - DATABASE_PATH=/app/data/foodhub.db
      - JWT_SECRET=change_this_secret_in_production_please
    volumes:
      - foodhub_data:/app/data
    command: bundle exec puma -C puma.rb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  foodhub_data: