openapi: 3.0.3
info:
  title: FoodHub Aggregator API
  description: Production-ready food delivery aggregator REST API with authentication
  version: 1.0.0
servers:
  - url: http://localhost:4567
    description: Development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [customer, admin]
        created_at:
          type: integer
    
    Restaurant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cuisine:
          type: string
        address:
          type: string
        rating:
          type: number
          format: float
        delivery_fee:
          type: number
          format: float
        min_order:
          type: number
          format: float
        is_active:
          type: integer
        owner_id:
          type: integer
        created_at:
          type: integer
    
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        restaurant_id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        category:
          type: string
        is_available:
          type: integer
        created_at:
          type: integer
    
    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        restaurant_id:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, preparing, out_for_delivery, delivered, cancelled]
        total_amount:
          type: number
          format: float
        delivery_address:
          type: string
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: integer
        updated_at:
          type: integer
    
    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        menu_item_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: float
    
    Error:
      type: object
      properties:
        error:
          type: string

paths:
  /:
    get:
      summary: API Information
      responses:
        '200':
          description: API metadata
          content:
            application/json:
              schema:
                type: object
  
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: integer
  
  /api/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/auth/me:
    get:
      summary: Get current user
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/restaurants:
    get:
      summary: List all restaurants
      tags:
        - Restaurants
      parameters:
        - name: cuisine
          in: query
          schema:
            type: string
        - name: min_rating
          in: query
          schema:
            type: number
      responses:
        '200':
          description: List of restaurants
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
    
    post:
      summary: Create a new restaurant
      tags:
        - Restaurants
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - cuisine
                - address
              properties:
                name:
                  type: string
                cuisine:
                  type: string
                address:
                  type: string
                delivery_fee:
                  type: number
                  format: float
                min_order:
                  type: number
                  format: float
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/restaurants/{id}:
    get:
      summary: Get restaurant by ID
      tags:
        - Restaurants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Restaurant details with menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
                  menu_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MenuItem'
        '404':
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      summary: Update restaurant
      tags:
        - Restaurants
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cuisine:
                  type: string
                address:
                  type: string
                delivery_fee:
                  type: number
                min_order:
                  type: number
                rating:
                  type: number
                is_active:
                  type: boolean
      responses:
        '200':
          description: Restaurant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    
    delete:
      summary: Delete restaurant
      tags:
        - Restaurants
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Restaurant deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  
  /api/restaurants/{id}/menu:
    post:
      summary: Add menu item to restaurant
      tags:
        - Restaurants
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                category:
                  type: string
      responses:
        '201':
          description: Menu item added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: '#/components/schemas/MenuItem'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Restaurant not found
  
  /api/orders:
    get:
      summary: List orders
      tags:
        - Orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
    
    post:
      summary: Create a new order
      tags:
        - Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - restaurant_id
                - delivery_address
                - items
              properties:
                restaurant_id:
                  type: integer
                delivery_address:
                  type: string
                notes:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - menu_item_id
                      - quantity
                    properties:
                      menu_item_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Restaurant not found
  
  /api/orders/{id}:
    get:
      summary: Get order by ID
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  
  /api/orders/{id}/status:
    patch:
      summary: Update order status
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, preparing, out_for_delivery, delivered, cancelled]
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found