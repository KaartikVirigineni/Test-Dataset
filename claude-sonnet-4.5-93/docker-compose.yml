version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://mongo:27017/meteor
      - PORT=3000
      - JWT_SECRET=inventory-secret-key-change-in-production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/.meteor/local
    command: sh -c "cd /app && meteor run --port 3000 --production"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data: